name: Jenkins plugin lock

# The jenkins provider installs exactly the plugins in
# internal/providers/jenkins/plugins.lock, locked for the Jenkins core of its
# pinned chart. verify proves a changed lock installs, boots, and runs in
# Kubernetes; bump proposes a new lock every week.
on:
  pull_request:
    paths:
      - "internal/providers/jenkins/**"
      - "scripts/verify-jenkins.sh"
      - ".github/workflows/jenkins.yml"
  push:
    branches: [main]
    paths:
      - "internal/providers/jenkins/**"
      - "scripts/verify-jenkins.sh"
      - ".github/workflows/jenkins.yml"
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jenkins-lock-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify the plugin lock
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.1
      - name: Test the provider and the lock
        run: go test ./internal/providers/jenkins/...
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          version: v0.33.0
          kubectl_version: v1.37.1
          cluster_name: jenkins-verify
      # Installs the lock with jenkins-plugin-cli, boots Jenkins with it and
      # a JCasC configuration like Ownstack's, then installs the chart at the
      # lock's version with testdata/values.golden.yaml into the kind cluster
      # (helm install --wait --timeout 15m).
      - name: Install, boot, and deploy the locked plugins
        run: scripts/verify-jenkins.sh --boot --kind

  bump:
    name: Propose a new plugin lock
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: jenkins-lock-bump
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      GH_REPO: ${{ github.repository }}
      # The branch the run started from: the default branch for scheduled runs.
      BASE: ${{ github.ref_name }}
      BRANCH: jenkins-lock-bump
      LOCK: internal/providers/jenkins/plugins.lock
      WARNINGS_TITLE: "Jenkins: security warnings block the plugin lock update"
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.1

      # lockgen writes plugins.lock, the Jenkins chart version, and the golden
      # values. Exit status 3: only security warnings stopped it. It is built,
      # then run, because `go run` reports every failure as status 1.
      - name: Lock the plugins for the newest chart
        id: lockgen
        run: |
          go build -o "$RUNNER_TEMP/lockgen" ./internal/providers/jenkins/lockgen
          status=0
          "$RUNNER_TEMP/lockgen" -latest-chart >"$RUNNER_TEMP/lockgen.out" 2>"$RUNNER_TEMP/lockgen.err" || status=$?
          cat "$RUNNER_TEMP/lockgen.err" "$RUNNER_TEMP/lockgen.out"
          changes=$(git status --porcelain)
          echo "$changes"
          case "$status" in
            0) if [ -n "$changes" ]; then result=changed; else result=unchanged; fi ;;
            3) [ -z "$changes" ] || { echo "::error::lockgen changed files although it refused the lock"; exit 1; }
               result=warnings ;;
            *) exit "$status" ;;
          esac
          echo "result=$result" >>"$GITHUB_OUTPUT"

      - name: Open, update, or close the security warnings issue
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.lockgen.outputs.result }}
        run: |
          number=$(gh issue list --state open --search "\"$WARNINGS_TITLE\" in:title" --json number,title \
            --jq "map(select(.title == env.WARNINGS_TITLE)) | .[0].number // empty")
          if [ "$RESULT" != warnings ]; then
            [ -z "$number" ] || gh issue close "$number" --comment "The plugins now lock without security warnings: $RUN_URL"
            exit 0
          fi
          {
            echo "The Jenkins plugin lock update stopped because published security warnings match plugin versions it would lock. \`plugins.lock\` is unchanged."
            echo
            echo '```text'
            grep -E '^(Resolving|security warning:)' "$RUNNER_TEMP/lockgen.err" | head -c 60000 || true
            echo '```'
            echo
            echo "Options: wait for fixed releases (the next scheduled run retries), drop the plugin from \`plugins.in\`, or lock anyway with \`go run ./internal/providers/jenkins/lockgen -latest-chart -allow-warnings\` after reviewing the advisories."
            echo
            echo "Run: $RUN_URL"
          } >"$RUNNER_TEMP/issue.md"
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue create --title "$WARNINGS_TITLE" --body-file "$RUNNER_TEMP/issue.md"
          fi

      # Pull requests opened with GITHUB_TOKEN start no workflows, so this job
      # runs everything CI and the verify job would.
      - name: Vet and test
        if: steps.lockgen.outputs.result == 'changed'
        run: go vet ./... && go test ./...
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        if: steps.lockgen.outputs.result == 'changed'
        with:
          version: v0.33.0
          kubectl_version: v1.37.1
          cluster_name: jenkins-verify
      - name: Install, boot, and deploy the locked plugins
        if: steps.lockgen.outputs.result == 'changed'
        run: scripts/verify-jenkins.sh --boot --kind

      - name: Open or update the pull request
        if: steps.lockgen.outputs.result == 'changed'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chart=$(sed -n 's/^# chart: //p' "$LOCK")
          core=$(sed -n 's/^# jenkins: //p' "$LOCK")
          title="Jenkins: lock plugins for chart $chart / Jenkins $core"
          {
            echo "Generated by \`lockgen -latest-chart\` in [this run]($RUN_URL), which then passed \`go vet ./...\`, \`go test ./...\`, and \`scripts/verify-jenkins.sh --boot --kind\` with it."
            echo
            sed -n '1p' "$RUNNER_TEMP/lockgen.out"
            echo
            grep '^- ' "$RUNNER_TEMP/lockgen.out" || true
            echo
            echo "Pull requests opened by GitHub Actions do not start CI; close and reopen this one to run it. Stacks get these plugins when an ownstackctl release that contains this lock applies them."
          } >"$RUNNER_TEMP/pr.md"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$auth"
          git config --local "http.https://github.com/.extraheader" "AUTHORIZATION: basic $auth"

          # lockgen writes only under internal/.
          git switch -C "$BRANCH"
          git add -A -- internal
          git commit -q -m "$title"
          # When the branch already proposes this exact lock and golden values
          # (even on an older base), leave its pull request and reviews alone,
          # and do not propose it again after a person closed it. The lock's
          # header carries the chart, so chart.go needs no comparison.
          if git fetch -q origin "$BRANCH" 2>/dev/null &&
            git diff --quiet FETCH_HEAD HEAD -- "$LOCK" internal/providers/jenkins/testdata; then
            head=$(git rev-parse FETCH_HEAD)
            number=$(gh pr list --head "$BRANCH" --base "$BASE" --state all --json number,headRefOid \
              --jq "map(select(.headRefOid == \"$head\")) | .[0].number // empty")
            if [ -n "$number" ]; then
              echo "Pull request #$number already proposes this lock"
              exit 0
            fi
          else
            git push -q --force origin "HEAD:refs/heads/$BRANCH"
          fi
          number=$(gh pr list --head "$BRANCH" --base "$BASE" --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr edit "$number" --title "$title" --body-file "$RUNNER_TEMP/pr.md"
          else
            gh pr create --head "$BRANCH" --base "$BASE" --title "$title" --body-file "$RUNNER_TEMP/pr.md"
          fi

# Ownstack pipeline: build every infrastructure/<app>/ that has a Dockerfile
# and a Helm chart, push it to your registry, and deploy it to your cluster.
# A push deploys to the first environment whose branch glob matches the
# branch (prod=main, dev=develop, qa=release/* by default); other branches do
# not build. Images are tagged with the commit, so each commit is built once:
# a rerun, or a merge that brings an already built commit, deploys the
# existing image. Run the workflow by hand to redeploy a branch.
# ownstackctl sets the OWNSTACK variable and the OWNSTACK_KUBECONFIG secret.
# ownstack-workflow: 5
name: ownstack

on:
  push:
    branches: ['**']
  workflow_dispatch:

# One run per branch at a time.
concurrency: ownstack-${{ github.ref_name }}

jobs:
  deploy:
    # Set the OWNSTACK_RUNNER variable (for example ubuntu-24.04-arm) to build
    # on a runner with the server's architecture instead of under emulation.
    runs-on: ${{ vars.OWNSTACK_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - name: Resolve the environment
        id: resolve
        env:
          OWNSTACK: ${{ vars.OWNSTACK }}
        run: |
          set -euo pipefail
          if [ -z "${OWNSTACK:-}" ]; then
            echo "::error::The OWNSTACK variable is not set. Run 'ownstackctl apply' on your server so it can configure this repo."
            exit 1
          fi
          # <environment>=<branch glob> items; the first names production.
          items="$(jq -r '.environments[]' <<< "$OWNSTACK")"
          environment=""
          production=""
          while IFS= read -r item; do
            production="${production:-${item%%=*}}"
            [[ "$item" == *=* ]] || continue
            # The glob is a pattern on purpose: * matches any characters, / too.
            # shellcheck disable=SC2254
            case "$GITHUB_REF_NAME" in
              ${item#*=}) environment="${item%%=*}"; break ;;
            esac
          done <<< "$items"
          if [ -z "$environment" ]; then
            echo "$GITHUB_REF_NAME deploys to no environment (${items//$'\n'/ }); nothing to build."
          else
            echo "$GITHUB_REF_NAME deploys to $environment (production: $production)."
          fi
          {
            echo "environment=$environment"
            echo "production=$production"
            jq -r '"domain=\(.domain)", "registry=\(.registry)", "platform=\(.platform // "linux/amd64")", "libraryRef=\(.libraryRef)"' <<< "$OWNSTACK"
          } >> "$GITHUB_OUTPUT"

      - if: ${{ steps.resolve.outputs.environment != '' }}
        uses: actions/checkout@v5

      - name: Fetch the Ownstack Helm library
        if: ${{ steps.resolve.outputs.environment != '' }}
        uses: actions/checkout@v5
        with:
          repository: getownstack/ownstack
          ref: ${{ steps.resolve.outputs.libraryRef }}
          path: .ownstack
          sparse-checkout: common_helm_library

      # Images are built for the server's platform; a runner with another
      # architecture builds them under QEMU emulation.
      - name: Set up emulation for the server's platform
        if: ${{ steps.resolve.outputs.environment != '' && steps.resolve.outputs.platform != (runner.arch == 'ARM64' && 'linux/arm64' || 'linux/amd64') }}
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3

      - name: Build, push, and deploy
        if: ${{ steps.resolve.outputs.environment != '' }}
        env:
          KUBECONFIG_DATA: ${{ secrets.OWNSTACK_KUBECONFIG }}
          ENVIRONMENT: ${{ steps.resolve.outputs.environment }}
          PRODUCTION: ${{ steps.resolve.outputs.production }}
          DOMAIN: ${{ steps.resolve.outputs.domain }}
          REGISTRY: ${{ steps.resolve.outputs.registry }}
          PLATFORM: ${{ steps.resolve.outputs.platform }}
        run: |
          set -euo pipefail
          if [ -z "${KUBECONFIG_DATA:-}" ]; then
            echo "::error::OWNSTACK_KUBECONFIG is not set. Run 'ownstackctl apply' on your server so it can configure this repo."
            exit 1
          fi
          # The environment's registry-credentials secret holds the push
          # credential, so Docker logs in with it.
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig" DOCKER_CONFIG="$RUNNER_TEMP/docker"
          (
            umask 077
            mkdir -p "$DOCKER_CONFIG"
            printf '%s' "$KUBECONFIG_DATA" > "$KUBECONFIG"
            kubectl -n "$ENVIRONMENT" get secret registry-credentials -o jsonpath='{.data.\.dockerconfigjson}' | base64 -d > "$DOCKER_CONFIG/config.json"
          )
          # The host the Helm library publishes an app at, from the release's
          # values (common_helm_library's rule).
          host_rule='
          import json, sys
          v = json.load(sys.stdin) or {}
          env, prod = str(v.get("environment") or ""), str(v.get("productionEnvironment") or "")
          if isinstance(v.get("environment"), (dict, list, bool)):
              env = ""
          if isinstance(v.get("productionEnvironment"), (dict, list, bool)):
              prod = ""
          if not env or not prod or env == prod:
              host = v.get("url") or "%s.%s" % (v.get("id"), v.get("domain"))
          else:
              urls = v.get("environmentUrls")
              host = (urls.get(env) if isinstance(urls, dict) else None) or "%s-%s.%s" % (v.get("id"), env, v.get("domain"))
          print(host)
          '
          tag="${GITHUB_SHA::12}"
          deployed=0
          for dir in infrastructure/*/; do
            dir="${dir%/}"
            app="${dir#infrastructure/}"
            [[ -f "$dir/Dockerfile" && -d "$dir/helm" ]] || continue
            image="$REGISTRY/$app:$tag"
            if docker manifest inspect "$image" > /dev/null 2>&1; then
              echo "$image exists, skipping the build."
            else
              echo "::group::Build $app"
              docker build --platform "$PLATFORM" -f "$dir/Dockerfile" -t "$image" .
              docker push "$image"
              echo "::endgroup::"
            fi
            echo "::group::Deploy $app"
            mkdir -p "$dir/helm/charts"
            cp -r .ownstack/common_helm_library "$dir/helm/charts/"
            helm upgrade --install "$app" "$dir/helm" --namespace "$ENVIRONMENT" \
              --set image="$image" --set id="$app" --set domain="$DOMAIN" \
              --set-string environment="$ENVIRONMENT" --set-string productionEnvironment="$PRODUCTION" \
              --wait --timeout 5m
            echo "::endgroup::"
            host="$(helm get values "$app" -n "$ENVIRONMENT" -a -o json | python3 -c "$host_rule")"
            echo "Deployed $app ($tag) to $ENVIRONMENT: https://$host" | tee -a "$GITHUB_STEP_SUMMARY"
            deployed=$((deployed + 1))
          done
          if [ "$deployed" -eq 0 ]; then
            echo "::warning::No infrastructure/<app>/ with a Dockerfile and helm chart found."
          fi

# Starter: fits a 2 GB server. Zot registry on the server, builds on GitHub
# Actions. Secrets: GITHUB_TOKEN and CLOUDFLARE_API_TOKEN (asked for on the
# server); the Zot password is generated.
apiVersion: ownstack.io/v1
kind: Stack
metadata:
  name: acme-platform
spec:
  domain: example.com
  compute:
    provider: own-vps
    settings:
      host: 203.0.113.10
  dns:
    provider: cloudflare
  ingress:
    provider: traefik
    settings:
      acmeEmail: ops@example.com
  vcs:
    provider: github
    settings:
      owner: acme
  images:
    provider: zot
  cicd:
    provider: gh-actions
    # settings:
    #   branches: develop=dev release/*=qa   # main deploys to prod; these branches to dev and qa

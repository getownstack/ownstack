# Bring your registry: your own Harbor, GHCR, Docker Hub, or any OCI
# registry. Nothing registry-related is installed on the server.
# Secrets: GITHUB_TOKEN, CLOUDFLARE_API_TOKEN, REGISTRY_PASSWORD.
apiVersion: ownstack.io/v1
kind: Stack
metadata:
  name: acme-platform
spec:
  domain: example.com
  compute:
    provider: own-vps
    settings:
      host: 203.0.113.10
  dns:
    provider: manual            # create A records for example.com and *.example.com yourself
  ingress:
    provider: traefik
    settings:
      acmeEmail: ops@example.com
  vcs:
    provider: github
    settings:
      owner: acme
  images:
    provider: registry
    settings:
      host: harbor.acme.internal.example.com   # or ghcr.io, docker.io
      project: product
      username: robot$ci
  cicd:
    provider: gh-actions

# Standard: everything self-hosted on a 4 GB+ server: Harbor and Jenkins.
# Secrets: GITHUB_TOKEN and CLOUDFLARE_API_TOKEN; the Harbor and Jenkins
# admin passwords are generated.
apiVersion: ownstack.io/v2
domain: example.com
# environments: [prod=main, dev=develop, qa=release/*]   # the default: <name>[=<branch>], the first is production
compute: {host: 203.0.113.10}
ingress: {acmeEmail: ops@example.com}
vcs: {owner: acme}
images: {provider: harbor}
cicd: {provider: jenkins}

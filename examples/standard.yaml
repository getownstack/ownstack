# Standard: everything self-hosted on a 4 GB+ server: Harbor and Jenkins.
# Secrets: GITHUB_TOKEN and CLOUDFLARE_API_TOKEN; admin passwords are generated.
apiVersion: ownstack.io/v1
kind: Stack
metadata:
  name: acme-platform
spec:
  domain: example.com
  # environments: [prod=main, dev=develop, qa=release/*]   # the default: <name>[=<branch>], the first is production
  compute:
    provider: own-vps
    settings:
      host: 203.0.113.10
  dns:
    provider: cloudflare        # reads CLOUDFLARE_API_TOKEN
  ingress:
    provider: traefik
    settings:
      acmeEmail: ops@example.com
  vcs:
    provider: github            # reads GITHUB_TOKEN
    settings:
      owner: acme
  images:
    provider: harbor            # HARBOR_ADMIN_PASSWORD is generated when unset
  cicd:
    provider: jenkins           # JENKINS_ADMIN_PASSWORD is generated when unset
